include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # This project ships Arabic and English for every visible string, so a
    # literal that reached a widget is a bug, not a style preference.
    prefer_const_constructors: ignore
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - unawaited_futures
