name: sms_portal
description: >-
  The school's portal on a phone — a Flutter client for the parent and student
  half of the SMS mobile API (docs/Integration/03-Mobile-API.md). It is a second
  view over screens the product already has, never a second product: every rule,
  permission and refusal belongs to the server.
publish_to: none

# The `+N` half is Android's versionCode. Bump it on every build a family is
# asked to install: a phone offered an APK whose versionCode it already has
# treats the install as a no-op, and the family concludes the app did not
# change. It is also what names the published file, so the browser cannot hand
# back a cached download of the previous build under the same name.
#
# 1.1.0 — the section palette, the icons, and money formatted as the web does.
version: 1.1.0+2

environment:
  # Built against Flutter 3.47.2 / Dart 3.13.2 (stable, 2026-08-27). The Flutter
  # floor is 3.27 rather than something older because `ThemeData.cardTheme`
  # takes `CardThemeData` from that release on, and the app names the type.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Kept deliberately small. Every package here is one more thing that has to
  # keep resolving on Dart 3.0 the next time somebody opens this project.
  http: ^1.2.0                    # no interceptor framework needed; one client, one place
  provider: ^6.1.2                # one controller is all the app-wide state there is
  flutter_secure_storage: ^9.2.2  # the session token is a credential, not a preference
  intl: ^0.20.2                   # must match what flutter_localizations pins

  # A lesson resource is fetched with the bearer token and handed to the phone
  # to open. It cannot simply be a link: the download endpoint is [Authorize]d,
  # a browser sends no Authorization header, and a token in the URL would leak a
  # live credential into history.
  path_provider: ^2.1.4
  open_filex: ^4.6.0

  # "Update now" hands the family to the portal's own app page, which already
  # carries the file, its size, its date and the four install steps in both
  # languages. The app deliberately does not fetch and install the package
  # itself: that needs REQUEST_INSTALL_PACKAGES in the manifest — the permission
  # to install software — for a job one browser tab already does, and the page
  # is also the only place the "allow installs from this browser" prompt is
  # explained. Flutter has no way to open a URL without a plugin; this is the
  # Flutter team's own.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
